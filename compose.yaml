services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Set NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?Set NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
    ports:
      - "127.0.0.1:${APP_PORT:-3001}:3000"
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-restaurant-images}
      SITE_URL: ${SITE_URL:-http://localhost:3001}
      UPLOAD_DIR: /app/data/uploads
    volumes:
      - uploads:/app/data/uploads
    restart: unless-stopped
    init: true

volumes:
  uploads:
